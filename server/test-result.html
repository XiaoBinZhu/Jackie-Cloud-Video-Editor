<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频展示 - Test Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        .info-label {
            font-weight: bold;
            color: #333;
            display: inline-block;
            width: 120px;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .no-video {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>视频展示</h1>
        <div id="content">
            <div class="loading">正在加载数据...</div>
        </div>
    </div>

    <script>
        async function loadVideoData() {
            const contentDiv = document.getElementById('content');

            try {
                const response = await fetch('test-result.json');
                if (!response.ok) {
                    throw new Error('无法加载 JSON 文件');
                }

                const data = await response.json();

                let html = '';

                // 显示任务信息
                html += '<div class="info">';
                html += `<div class="info-item"><span class="info-label">任务ID:</span> ${data.taskId || 'N/A'}</div>`;
                html += `<div class="info-item"><span class="info-label">输出文件:</span> ${data.outputFile || 'N/A'}</div>`;
                html += `<div class="info-item"><span class="info-label">时间戳:</span> ${data.timestamp || 'N/A'}</div>`;
                if (data.base64Length !== undefined) {
                    html += `<div class="info-item"><span class="info-label">Base64长度:</span> ${data.base64Length}</div>`;
                }
                html += '</div>';

                // 显示视频
                if (data.videoUrl && data.videoUrl.trim() !== '') {
                    html += '<div class="video-container">';
                    html += `<video controls autoplay muted>`;
                    html += `<source src="${data.videoUrl}" type="video/mp4">`;
                    html += `您的浏览器不支持视频标签。`;
                    html += `</video>`;
                    html += '</div>';
                } else {
                    html += '<div class="no-video">';
                    html += '<p>⚠️ 视频URL为空，无法播放视频</p>';
                    html += '</div>';
                }

                contentDiv.innerHTML = html;

            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <strong>错误:</strong> ${error.message}
                        <br><br>
                        请确保 test-result.json 文件在同一目录下，并且可以通过 HTTP 服务器访问。
                    </div>
                `;
            }
        }

        // 页面加载时获取数据
        loadVideoData();

        // 每5秒刷新一次数据（可选）
        // setInterval(loadVideoData, 5000);
    </script>
</body>

</html>
